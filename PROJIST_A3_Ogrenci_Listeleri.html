<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>PROJİST Fest '26 — Sınıf Öğrenci Listeleri</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --istek-blue: #1B75BB;
    --istek-blue-dark: #0F4F82;
    --istek-blue-darker: #083559;
    --gold: #F4A923;
    --gold-light: #FFC857;
    --sunum-bg: #ECFDF5;
    --sunum-color: #047857;
    --izleyici-bg: #FFFBEB;
    --izleyici-color: #B45309;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    background: #E5E7EB;
    color: #0F172A;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  .controls {
    position: fixed; bottom: 20px; left: 20px;
    background: white; padding: 12px 14px;
    border-radius: 12px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    z-index: 9999;
    font-size: 12px;
    max-width: 240px;
    border: 1px solid #E2E8F0;
  }
  .controls button {
    background: #1B75BB; color: white; border: 0;
    padding: 9px 14px; border-radius: 8px;
    font-weight: 700; font-family: inherit;
    cursor: pointer; width: 100%;
    margin-top: 6px;
    font-size: 13px;
  }
  .controls button:hover { background: #0F4F82; }
  .controls p { color: #475569; line-height: 1.45; font-size: 11.5px; }

  .poster {
    width: 297mm;
    height: 420mm;
    background: var(--istek-blue);
    margin: 24px auto;
    position: relative;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    color: white;
    page-break-after: always;
    break-after: page;
  }
  .poster:last-child { page-break-after: auto; }

  .poster-top { width: 100%; height: auto; display: block; }
  .poster-bottom { position: absolute; bottom: 0; left: 0; right: 0; width: 100%; display: block; }

  .poster-content {
    position: absolute;
    top: 78mm;
    left: 12mm;
    right: 12mm;
    bottom: 18mm;
    display: flex;
    flex-direction: column;
  }

  /* Başlık */
  .title-block {
    text-align: center;
    margin-bottom: 2mm;
  }
  .title-block .eyebrow {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-size: 8.5pt;
    font-weight: 700;
    letter-spacing: 3.5pt;
    color: var(--gold-light);
    text-transform: uppercase;
    margin-bottom: 1.5mm;
  }
  .title-block .class-name {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-size: 42pt;
    font-weight: 800;
    line-height: 0.95;
    letter-spacing: -1.5pt;
    color: white;
    margin-bottom: 0.5mm;
  }
  .title-block .class-sub {
    font-size: 10pt;
    font-weight: 500;
    color: rgba(255,255,255,0.85);
    letter-spacing: 0.3pt;
  }

  .gold-bar {
    width: 40mm;
    height: 1.2mm;
    background: linear-gradient(90deg, var(--gold), var(--gold-light));
    margin: 2mm auto 3mm;
    border-radius: 1mm;
  }

  /* Legend */
  .legend {
    display: flex;
    gap: 4mm;
    justify-content: center;
    margin-bottom: 2mm;
    font-size: 8.5pt;
    color: rgba(255,255,255,0.9);
  }
  .legend-item {
    display: inline-flex;
    align-items: center;
    gap: 1.5mm;
  }
  .legend-dot {
    width: 2.5mm; height: 2.5mm;
    border-radius: 50%;
  }
  .legend-dot.sunum { background: #10B981; }
  .legend-dot.izleyici { background: #F59E0B; }

  /* Liste kartı */
  .list-card {
    flex: 1;
    background: white;
    border-radius: 4mm;
    overflow: hidden;
    color: #0F172A;
    box-shadow: 0 2mm 6mm rgba(0,0,0,0.18);
    display: flex;
    flex-direction: column;
  }

  .list-header {
    background: linear-gradient(135deg, var(--istek-blue-dark) 0%, var(--istek-blue-darker) 100%);
    color: white;
    padding: 2.5mm 6mm;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: relative;
    flex-shrink: 0;
  }
  .list-header::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1mm;
    background: var(--gold);
  }
  .list-header-title {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-size: 11pt;
    font-weight: 800;
    letter-spacing: -0.3pt;
  }
  .list-header-meta {
    font-size: 8.5pt;
    font-weight: 600;
    opacity: 0.9;
    letter-spacing: 0.3pt;
  }

  /* Öğrenci tablosu */
  .student-list {
    flex: 1;
    padding: 0;
    overflow: hidden;
  }
  .student-row {
    display: grid;
    grid-template-columns: 7mm 1fr;
    align-items: center;
    padding: 1.3mm 4mm;
    border-bottom: 0.3mm solid #E2E8F0;
  }
  .student-row:last-child { border-bottom: 0; }
  .student-row:nth-child(even) { background: #F8FAFC; }

  .student-num {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-size: 8.5pt;
    font-weight: 800;
    color: var(--istek-blue);
    text-align: right;
    padding-right: 2mm;
  }
  .student-body {
    display: flex;
    align-items: center;
    gap: 3mm;
    min-width: 0;
  }
  .student-name {
    font-size: 9pt;
    color: #1E293B;
    font-weight: 700;
    white-space: nowrap;
    min-width: 45mm;
    width: 50mm;
    flex-shrink: 0;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .student-info {
    flex: 1;
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 4mm;
    min-width: 0;
    flex-wrap: nowrap;
  }
  .tasks {
    display: flex;
    gap: 1.2mm;
    flex-wrap: nowrap;
    overflow: hidden;
    flex-shrink: 0;
  }
  .teachers {
    display: flex;
    gap: 1.2mm;
    flex-wrap: nowrap;
    overflow: hidden;
    min-width: 0;
  }
  .task-chip {
    display: inline-flex;
    align-items: center;
    gap: 0.8mm;
    padding: 0.6mm 1.8mm;
    border-radius: 1.5mm;
    font-size: 7pt;
    font-weight: 700;
    line-height: 1.1;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .task-chip.sunum {
    background: var(--sunum-bg);
    color: var(--sunum-color);
    border: 0.3mm solid #6EE7B7;
  }
  .task-chip.izleyici {
    background: var(--izleyici-bg);
    color: var(--izleyici-color);
    border: 0.3mm solid #FCD34D;
  }
  .task-ders {
    font-weight: 800;
    background: rgba(255,255,255,0.7);
    padding: 0.2mm 0.8mm;
    border-radius: 0.8mm;
    font-size: 6.5pt;
  }
  .task-empty {
    color: #94A3B8;
    font-size: 8pt;
    font-style: italic;
  }
  .teacher-tag {
    display: inline-flex;
    align-items: center;
    gap: 0.8mm;
    padding: 0.4mm 1.5mm;
    border-radius: 1mm;
    font-size: 7pt;
    font-weight: 600;
    line-height: 1.1;
    white-space: nowrap;
    flex-shrink: 0;
    background: #F1F5F9;
    color: #475569;
    border: 0.2mm solid #CBD5E1;
  }
  .teacher-tag.single {
    background: transparent;
    border: none;
    padding: 0.3mm 0;
    color: #64748B;
    font-size: 7.5pt;
  }
  .teacher-tag.single .teacher-label {
    font-weight: 500;
  }
  .teacher-tag.single b {
    color: #1E293B;
    font-weight: 800;
    margin-left: 0.5mm;
  }
  .teacher-ders {
    font-weight: 800;
    color: #1E293B;
    padding: 0.1mm 0.6mm;
    background: white;
    border-radius: 0.6mm;
    font-size: 6pt;
  }

  /* Footer */
  .footer-info {
    background: linear-gradient(135deg, #F8FAFC 0%, #E8F2FA 100%);
    border-top: 0.3mm solid #E2E8F0;
    padding: 1.8mm 6mm;
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: var(--istek-blue-dark);
    font-size: 7.5pt;
    flex-shrink: 0;
  }
  .footer-info .left { font-weight: 700; letter-spacing: 0.3pt; }
  .footer-info .right { font-weight: 500; color: #64748B; }

  @media print {
    body { background: white; }
    .controls { display: none !important; }
    .poster { margin: 0; box-shadow: none; }
    @page { size: A3 portrait; margin: 0; }
  }
</style>
</head>

const CLASS_LABELS = {
  "9/A":"9. Sınıf A Şubesi","9/B":"9. Sınıf B Şubesi",
  "10/A":"10. Sınıf A Şubesi","10/B":"10. Sınıf B Şubesi","10/C":"10. Sınıf C Şubesi",
  "11/A":"11. Sınıf A Şubesi","11/B":"11. Sınıf B Şubesi","11/C":"11. Sınıf C Şubesi",
  "9FL":"9. Sınıf FL","10FL":"10. Sınıf FL","11FL":"11. Sınıf FL"
};

function taskChip(t){
  // Örn: "2.Ders 9A SUNUM" şeklinde kısa
  const dersKisa = t.ders.replace('. Ders','.');
  const rolKisa = t.rol === 'sunum' ? 'SUN' : 'İZL';
  return `<span class="task-chip ${t.rol}"><span class="task-ders">${dersKisa}</span> ${t.sinif} ${rolKisa}</span>`;
}

function teacherForTask(t){
  const lessonObj = DATA_CLASSES[t.sinif].find(l => l.ders === t.ders);
  if(!lessonObj) return '';
  return t.rol === 'sunum' ? lessonObj.sunum_ogretmen : lessonObj.izleyici_ogretmen;
}

function studentRow(student, idx, sube){
  const tasks = STUDENT_TASKS[sube + '|' + student] || [];
  let mainHtml = '';
  let teacherHtml = '';
  if(tasks.length === 0){
    mainHtml = '<span class="task-empty">— Grup ataması yok</span>';
  } else {
    mainHtml = tasks.map(taskChip).join('');
    // Her görev için öğretmeni çıkar
    const taskTeachers = tasks.map(t => ({
      ders: t.ders.replace('. Ders','.'),
      teacher: teacherForTask(t)
    }));
    // Hepsi aynı öğretmen mi?
    const uniqueTeachers = [...new Set(taskTeachers.map(x => x.teacher).filter(Boolean))];
    if(uniqueTeachers.length === 1){
      // Tek öğretmen — kısa şekilde göster
      teacherHtml = `<div class="teachers"><span class="teacher-tag single"><span class="teacher-label">Görevli Öğretmen:</span> <b>${uniqueTeachers[0]}</b></span></div>`;
    } else {
      // Farklı öğretmenler — ders ders göster
      const tags = taskTeachers
        .filter(x => x.teacher)
        .map(x => `<span class="teacher-tag"><span class="teacher-ders">${x.ders}</span> ${x.teacher}</span>`)
        .join('');
      teacherHtml = `<div class="teachers">${tags}</div>`;
    }
  }
  return `
    <div class="student-row">
      <div class="student-num">${idx+1}</div>
      <div class="student-body">
        <div class="student-name">${student}</div>
        <div class="student-info">
          <div class="tasks">${mainHtml}</div>
          ${teacherHtml}
        </div>
      </div>
    </div>
  `;
}

function poster(sube){
  const students = CLASS_STUDENTS[sube];
  const rows = students.map((s, i) => studentRow(s, i, sube)).join('');
  return `
    <div class="poster">
      <img class="poster-top" src="${TOP_BG}" alt="">
      <div class="poster-content">
        <div class="title-block">
          <div class="eyebrow">PROJİST FEST '26 · Sınıf Programı</div>
          <div class="class-name">${sube}</div>
          <div class="class-sub">${CLASS_LABELS[sube]}</div>
        </div>
        <div class="gold-bar"></div>
        <div class="legend">
          <span class="legend-item"><span class="legend-dot sunum"></span>SUN = Sunum yapacak</span>
          <span class="legend-item"><span class="legend-dot izleyici"></span>İZL = İzleyici</span>
        </div>
        <div class="list-card">
          <div class="list-header">
            <div class="list-header-title">Öğrenci Görev Programı</div>
            <div class="list-header-meta">${students.length} Öğrenci</div>
          </div>
          <div class="student-list">${rows}</div>
          <div class="footer-info">
            <span class="left">İSTEK KEMAL ATATÜRK OKULLARI</span>
            <span class="right">PROJİST Fest '26</span>
          </div>
        </div>
      </div>
      <img class="poster-bottom" src="${BOT_BG}" alt="">
    </div>
  `;
}

const ORDER = Object.keys(CLASS_STUDENTS);
document.getElementById('posters').innerHTML = ORDER.map(poster).join('');
